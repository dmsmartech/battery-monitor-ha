type: grid
cards:
  - type: heading
    heading_style: title
  - type: custom:auto-entities
    card:
      type: grid
      columns: 1
      square: false
    card_param: cards
    filter:
      include:
        - attributes:
            device_class: battery
          options:
            type: tile
      exclude:
        - state: unavailable
        - state: unknown
    sort:
      method: state
      numeric: true
      reverse: false
